# ─────────────────────────────────────────────────────────────
#  Конфиг nginx для портфолио (статический сайт)
#  Положить как:  /etc/nginx/sites-available/portfolio
#  Активировать:  ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#                 nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    # ← замени на свой домен или IP VM
    server_name dmitryurusov.ru www.dmitryurusov.ru;

    # ← путь, куда скопирована папка проекта на VM
    root /var/www/portfolio;
    index index.html;

    charset utf-8;

    # gzip для текстовых файлов (видео/картинки не сжимаем — бессмысленно)
    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 1024;

    # отдаём существующий файл, иначе 404
    location / {
        try_files $uri $uri/ =404;
    }

    # медиа: долгий кеш + поддержка перемотки (Range) — у nginx из коробки
    location ~* \.(mp4|mov|webm|m4v|png|jpe?g|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        # для больших видео полезно отдавать без буферизации в файл
        sendfile on;
        tcp_nopush on;
    }

    # css/js — кеш с проверкой
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # тяжёлые загрузки видео не должны рваться по таймауту
    client_max_body_size 0;
    keepalive_timeout 75s;
}
